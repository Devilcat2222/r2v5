<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Qubena(キュビナ)</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="stage">
    <section class="console">
      <div class="console-header">
        <div class="dots">
          <span></span><span></span><span></span>
        </div>
        <div class="title">r2v5 — Console</div>
      </div>

      <div class="console-body">
        <div class="screen" id="screen">
          <div class="boot" id="boot"></div>
          <div class="tiles" id="tiles">
            <button class="tile" data-href="/bookmarklet.html">ブックマークレット</button>
            <button class="tile" data-href="/proxy.html">プロキシ(ブロック解除)</button>
            <button class="tile" data-href="/tool.html">ツール</button>
            <button class="tile">Contact</button>
            <button class="tile">Download</button>
            <button class="tile">Demo</button>
            <button class="tile">GitHub</button>
          </div>
        </div>
      </div>
    </section>

    <!-- right-side link panel removed per request -->
  </main>

  <div class="bg-grid"></div>
  <script src="script.js" defer></script>
</body>
</html>
